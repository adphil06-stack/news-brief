<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>The News Brief</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="News Brief">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#f7f3ea" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#16150f" media="(prefers-color-scheme: dark)">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png?v=5">
<link rel="icon" type="image/png" href="icons/icon-192.png?v=5">
<style>
  :root {
    --paper: #f7f3ea; --ink: #1a1a1a; --muted: #5f5a50; --rule: #1a1a1a;
    --hair: #cfc7b6; --kicker: #8b1e1e; --link: #1a1a1a; --up: #1d6b34; --down: #a3241c;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --paper: #16150f; --ink: #ece6d8; --muted: #a39d8f; --rule: #ece6d8;
      --hair: #3a372e; --kicker: #e07a6a; --link: #ece6d8; --up: #6cc287; --down: #ee8676;
    }
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--paper); color: var(--ink);
    font: 17px/1.55 Georgia, "Times New Roman", ui-serif, serif; -webkit-text-size-adjust: 100%; }
  .wrap { max-width: 680px; margin: 0 auto; padding: 0 18px; }
  header { padding-top: calc(env(safe-area-inset-top) + 18px); text-align: center; }
  .masthead { font-family: "Old English Text MT", "UnifrakturMaguntia", Georgia, serif; font-weight: 700;
    font-size: clamp(34px, 10vw, 54px); line-height: 1; letter-spacing: -0.01em; margin: 6px 0 10px; }
  .dateline { border-top: 3px double var(--rule); border-bottom: 1px solid var(--rule);
    display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 4px 10px;
    padding: 6px 2px; font-size: 13px; text-transform: uppercase; letter-spacing: 0.08em; }
  .dateline .ed { color: var(--muted); }
  .dateline select { font: inherit; font-size: 12px; text-transform: none; letter-spacing: 0;
    background: transparent; color: var(--ink); border: 1px solid var(--hair); border-radius: 3px; padding: 3px 4px; max-width: 120px; }
  main { padding-bottom: calc(env(safe-area-inset-bottom) + 36px); }
  .glance { margin: 18px 0 8px; }
  .glance h2, section h2 { font-family: Georgia, serif; font-size: 13px; font-weight: 700; text-transform: uppercase;
    letter-spacing: 0.14em; text-align: center; margin: 0 0 10px; }
  .glance ul { margin: 0; padding: 0; list-style: none; }
  .glance li { padding: 5px 0 5px 16px; position: relative; font-style: italic; }
  .glance li::before { content: "■"; position: absolute; left: 0; top: 7px; font-size: 8px; font-style: normal; color: var(--kicker); }
  section { margin-top: 22px; }
  section h2 { border-top: 3px double var(--rule); border-bottom: 1px solid var(--rule); padding: 6px 0; }
  article { padding: 14px 0; border-bottom: 1px solid var(--hair); }
  article:last-child { border-bottom: none; }
  article h3 { font-size: 22px; line-height: 1.2; font-weight: 700; margin: 2px 0 8px; }
  section:first-of-type article:first-of-type h3 { font-size: 27px; }
  article p { margin: 0 0 6px; }
  article p::first-letter { }
  .tag { font-family: -apple-system, "Helvetica Neue", Arial, sans-serif; font-size: 11px; font-weight: 700;
    text-transform: uppercase; letter-spacing: 0.1em; color: var(--kicker); }
  .src { font-size: 13px; font-style: italic; color: var(--muted); }
  .src a { color: var(--link); text-decoration: underline; text-decoration-color: var(--hair); text-underline-offset: 2px; }
  .mkt-take { font-style: italic; margin: 10px 0 12px; }
  .mkt-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 0; border-top: 1px solid var(--hair); border-left: 1px solid var(--hair); }
  .mkt-cell { padding: 8px 8px 7px; border-right: 1px solid var(--hair); border-bottom: 1px solid var(--hair); }
  .mkt-name { font-family: -apple-system, "Helvetica Neue", Arial, sans-serif; font-size: 11px; font-weight: 700;
    text-transform: uppercase; letter-spacing: 0.08em; color: var(--muted); }
  .mkt-val { font-size: 17px; font-weight: 700; font-variant-numeric: tabular-nums; }
  .chg { font-family: -apple-system, "Helvetica Neue", Arial, sans-serif; font-size: 13px; font-weight: 700; font-variant-numeric: tabular-nums; }
  .up { color: var(--up); } .down { color: var(--down); }
  .movers { list-style: none; margin: 12px 0 0; padding: 0; }
  .movers li { padding: 7px 0; border-bottom: 1px solid var(--hair); }
  .movers li:last-child { border-bottom: none; }
  .movers b { font-family: -apple-system, "Helvetica Neue", Arial, sans-serif; font-size: 13px; letter-spacing: 0.04em; }
  .mkt-asof { font-size: 12px; color: var(--muted); font-style: italic; margin-top: 4px; }
  @media (max-width: 420px) { .mkt-grid { grid-template-columns: repeat(2, 1fr); } }
  .status { text-align: center; color: var(--muted); font-style: italic; padding: 40px 10px; }
  footer { text-align: center; font-size: 12px; color: var(--muted); border-top: 3px double var(--rule);
    margin-top: 18px; padding-top: 8px; font-style: italic; }
  @media print {
    body { background: #fff; color: #000; font-size: 10.5pt; }
    .dateline select { display: none; }
    .up, .down { color: #000; } .mkt-grid { grid-template-columns: repeat(6, 1fr); } .movers li { padding: 3px 0; }
    article { break-inside: avoid; padding: 6px 0; }
    article h3 { font-size: 13pt; } section:first-of-type article:first-of-type h3 { font-size: 15pt; }
    .masthead { font-size: 30pt; }
    @page { margin: 0.55in; }
  }
</style>
</head>
<body>
<div class="wrap">
<header>
  <div class="masthead">The News Brief</div>
  <div class="dateline">
    <span id="date">Loading…</span>
    <span class="ed" id="ed"></span>
    <select id="past" aria-label="Past editions" hidden></select>
  </div>
</header>
<main id="main"><div class="status">Loading today's edition…</div></main>
</div>

<script>
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const safeUrl = (u) => /^https?:\/\//i.test(u || "") ? u : "#";

async function getJSON(path) {
  const r = await fetch(path + "?t=" + Date.now(), { cache: "no-store" });
  if (!r.ok) throw new Error(r.status);
  return r.json();
}

function story(s) {
  return `<article>
    ${s.tag ? `<div class="tag">${esc(s.tag)}</div>` : ""}
    <h3>${esc(s.headline)}</h3>
    <p>${esc(s.summary)}</p>
    ${s.url ? `<div class="src"><a href="${esc(safeUrl(s.url))}" target="_blank" rel="noopener">${esc(s.source || "Source")} ↗</a></div>` : ""}
  </article>`;
}

function dir(c) { const t = String(c || "").trim(); return /^[+▲]/.test(t) ? "up" : /^[-−–▼]/.test(t) ? "down" : ""; }

function markets(m) {
  if (!m || !(m.indexes?.length || m.movers?.length || m.summary)) return "";
  const cells = (m.indexes || []).map(i => `<div class="mkt-cell"><div class="mkt-name">${esc(i.name)}</div>
      ${i.value ? `<div class="mkt-val">${esc(i.value)}</div>` : ""}<div class="chg ${dir(i.change)}">${esc(i.change)}</div></div>`).join("");
  const movers = (m.movers || []).map(x => `<li><b>${esc(x.symbol)}</b>${x.name ? " " + esc(x.name) : ""}
      <span class="chg ${dir(x.change)}">${esc(x.change)}</span> — ${esc(x.note)}</li>`).join("");
  return `<section><h2>Markets</h2>
    ${m.summary ? `<p class="mkt-take">${esc(m.summary)}</p>` : ""}
    ${cells ? `<div class="mkt-grid">${cells}</div>` : ""}
    ${movers ? `<ul class="movers">${movers}</ul>` : ""}
    <div class="mkt-asof">${m.asOf ? "As of " + esc(m.asOf) : ""}${m.url ? ` · <span class="src"><a href="${esc(safeUrl(m.url))}" target="_blank" rel="noopener">${esc(m.source || "Source")} ↗</a></span>` : ""}</div>
  </section>`;
}

function render(b) {
  $("date").textContent = b.dateLabel || b.date || "";
  const t = (b.updated || "").match(/(\d{1,2}):\d{2}\s*(AM|PM)/i);
  let ed = "";
  if (t) { const h = (+t[1] % 12) + (t[2].toUpperCase() === "PM" ? 12 : 0); ed = h < 11 ? "Morning Edition" : h < 16 ? "Midday Edition" : "Evening Edition"; }
  $("ed").textContent = ed;
  document.title = "News Brief — " + (b.dateLabel || b.date || "");
  $("main").innerHTML = `
    ${b.glance?.length ? `<div class="glance"><h2>At a glance</h2><ul>${b.glance.map(g => `<li>${esc(g)}</li>`).join("")}</ul></div>` : ""}
    ${b.tech?.length ? `<section><h2>Tech</h2>${b.tech.map(story).join("")}</section>` : ""}
    ${markets(b.markets)}
    ${b.other?.length ? `<section><h2>Other headlines</h2>${b.other.map(story).join("")}</section>` : ""}
    ${b.note ? `<div class="status">${esc(b.note)}</div>` : ""}
    <footer>${b.updated ? "Last updated " + esc(b.updated) : ""}</footer>`;
  window.scrollTo(0, 0);
}

async function loadPast(current) {
  try {
    const list = await getJSON("archive/index.json");
    if (!Array.isArray(list) || list.length < 2) return;
    const sel = $("past");
    sel.innerHTML = list.slice(0, 30).map(d =>
      `<option value="${esc(d.date)}"${d.date === current ? " selected" : ""}>${esc(d.label || d.date)}</option>`).join("");
    sel.hidden = false;
    sel.onchange = async () => {
      try { render(await getJSON("archive/" + sel.value + ".json")); }
      catch { $("main").innerHTML = '<div class="status">Couldn\'t load that day.</div>'; }
    };
  } catch {}
}

(async () => {
  try {
    const b = await getJSON("brief.json");
    render(b);
    loadPast(b.date);
  } catch {
    $("date").textContent = "";
    $("main").innerHTML = '<div class="status">Couldn\'t load the brief. Check your connection and reopen.</div>';
  }
})();
document.addEventListener("visibilitychange", async () => {
  if (document.visibilityState === "visible" && $("past").selectedIndex <= 0) {
    try { render(await getJSON("brief.json")); } catch {}
  }
});
</script>
</body>
</html>
