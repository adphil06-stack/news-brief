<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>News Brief</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="News Brief">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#0f172a">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" type="image/png" href="icons/icon-192.png">
<style>
  :root {
    --bg: #f8fafc; --card: #ffffff; --ink: #0f172a; --muted: #64748b;
    --line: #e2e8f0; --accent: #2563eb; --accent-soft: #eff6ff; --head: #0f172a;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0b1120; --card: #111827; --ink: #e5e7eb; --muted: #94a3b8;
      --line: #1f2937; --accent: #60a5fa; --accent-soft: #172036; --head: #020617;
    }
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--bg); color: var(--ink);
    font: 16px/1.5 -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    -webkit-text-size-adjust: 100%; }
  header { background: var(--head); color: #fff;
    padding: calc(env(safe-area-inset-top) + 18px) 20px 18px; position: sticky; top: 0; z-index: 5; }
  header .row { max-width: 720px; margin: 0 auto; display: flex; align-items: end; justify-content: space-between; gap: 12px; }
  header h1 { margin: 0; font-size: 22px; letter-spacing: -0.01em; }
  header .date { color: #cbd5e1; font-size: 14px; margin-top: 2px; }
  header select { background: #1e293b; color: #e2e8f0; border: 1px solid #334155; border-radius: 8px;
    padding: 6px 8px; font-size: 14px; max-width: 150px; }
  main { max-width: 720px; margin: 0 auto; padding: 16px 16px calc(env(safe-area-inset-bottom) + 32px); }
  .glance { background: var(--accent-soft); border-radius: 14px; padding: 14px 16px; margin-bottom: 20px; }
  .glance h2, section h2 { font-size: 12px; text-transform: uppercase; letter-spacing: 0.08em; color: var(--muted); margin: 0 0 8px; }
  .glance ul { margin: 0; padding-left: 18px; }
  .glance li { margin: 4px 0; }
  section { margin-bottom: 24px; }
  section h2 { border-bottom: 2px solid var(--line); padding-bottom: 6px; margin-bottom: 12px; }
  article { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 14px 16px; margin-bottom: 12px; }
  article h3 { font-size: 17px; line-height: 1.3; margin: 0 0 6px; }
  article p { margin: 0 0 8px; }
  .tag { display: inline-block; font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.05em;
    color: var(--accent); margin-bottom: 4px; }
  .src { font-size: 13px; color: var(--muted); }
  .src a { color: var(--accent); text-decoration: none; }
  .status { text-align: center; color: var(--muted); padding: 40px 10px; }
  footer { text-align: center; font-size: 12px; color: var(--muted); margin-top: 8px; }
  @media print {
    header { position: static; background: none; color: #000; padding: 0 0 8px; }
    header .date { color: #333; } header select { display: none; }
    body { background: #fff; color: #000; font-size: 10.5pt; }
    main { padding: 0; max-width: none; }
    article { border: none; padding: 0; margin-bottom: 8px; break-inside: avoid; }
    .glance { background: none; padding: 0; }
    @page { margin: 0.6in; }
  }
</style>
</head>
<body>
<header>
  <div class="row">
    <div>
      <h1>News Brief</h1>
      <div class="date" id="date">Loading…</div>
    </div>
    <select id="past" aria-label="Past briefs" hidden></select>
  </div>
</header>
<main id="main"><div class="status">Loading today's brief…</div></main>

<script>
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const safeUrl = (u) => /^https?:\/\//i.test(u || "") ? u : "#";

async function getJSON(path) {
  const r = await fetch(path + "?t=" + Date.now(), { cache: "no-store" });
  if (!r.ok) throw new Error(r.status);
  return r.json();
}

function story(s) {
  return `<article>
    ${s.tag ? `<div class="tag">${esc(s.tag)}</div>` : ""}
    <h3>${esc(s.headline)}</h3>
    <p>${esc(s.summary)}</p>
    ${s.url ? `<div class="src"><a href="${esc(safeUrl(s.url))}" target="_blank" rel="noopener">${esc(s.source || "Source")} ↗</a></div>` : ""}
  </article>`;
}

function render(b) {
  $("date").textContent = b.dateLabel || b.date || "";
  document.title = "News Brief — " + (b.dateLabel || b.date || "");
  $("main").innerHTML = `
    ${b.glance?.length ? `<div class="glance"><h2>At a glance</h2><ul>${b.glance.map(g => `<li>${esc(g)}</li>`).join("")}</ul></div>` : ""}
    ${b.tech?.length ? `<section><h2>Tech</h2>${b.tech.map(story).join("")}</section>` : ""}
    ${b.other?.length ? `<section><h2>Other headlines</h2>${b.other.map(story).join("")}</section>` : ""}
    ${b.note ? `<div class="status">${esc(b.note)}</div>` : ""}
    <footer>${b.updated ? "Updated " + esc(b.updated) : ""}</footer>`;
  window.scrollTo(0, 0);
}

async function loadPast(current) {
  try {
    const list = await getJSON("archive/index.json");
    if (!Array.isArray(list) || list.length < 2) return;
    const sel = $("past");
    sel.innerHTML = list.slice(0, 30).map(d =>
      `<option value="${esc(d.date)}"${d.date === current ? " selected" : ""}>${esc(d.label || d.date)}</option>`).join("");
    sel.hidden = false;
    sel.onchange = async () => {
      try { render(await getJSON("archive/" + sel.value + ".json")); }
      catch { $("main").innerHTML = '<div class="status">Couldn\'t load that day.</div>'; }
    };
  } catch {}
}

(async () => {
  try {
    const b = await getJSON("brief.json");
    render(b);
    loadPast(b.date);
  } catch {
    $("date").textContent = "";
    $("main").innerHTML = '<div class="status">Couldn\'t load the brief. Check your connection and reopen.</div>';
  }
})();
document.addEventListener("visibilitychange", async () => {
  if (document.visibilityState === "visible" && $("past").selectedIndex <= 0) {
    try { render(await getJSON("brief.json")); } catch {}
  }
});
</script>
</body>
</html>
